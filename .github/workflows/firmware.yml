name: Build nodes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "firmware/nodes/*"

      - name: Build all firmwares
        run: |
          cd firmware/nodes
          
          for node_dir in */; do
            if [ -f "${node_dir}Cargo.toml" ]; then
              echo "::group::Building ${node_dir}"
              cd "${node_dir}"
          
              # Resolve and install target
              TARGET=$(cargo config get build.target 2>/dev/null | tr -d '"' || true)
              if [ -n "$TARGET" ]; then
                echo "Installing target: $TARGET"
                rustup target add "$TARGET"
              fi
          
              # 1. Fail on warnings using Clippy (leaves config.toml rustflags intact)
              echo "Checking for warnings..."
              cargo clippy --release -- -D warnings
          
              # 2. Build the firmware
              echo "Running cargo build..."
              cargo build --release
          
              cd ..
              echo "::endgroup::"
            fi
          done