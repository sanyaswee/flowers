name: Host CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy \
            -p backend \
            -p cli \
            -p shared \
            --all-targets \
            -- -D warnings

      - name: Build
        run: |
          cargo build \
            -p backend \
            -p cli

      - name: Test
        run: |
          cargo test \
            -p backend \
            -p cli \
            -p shared
