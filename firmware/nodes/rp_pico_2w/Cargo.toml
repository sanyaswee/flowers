[package]
name = "rp-pico-2w"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "rp-pico-2w"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Core
core-logic = { path = "../../core" }

shared = { path = "../../../shared" }

# Embassy
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "critical-section-impl", "time-driver"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

static_cell = { version = "2.1.1" }

# Logs & panic
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"

# Cortex-M
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

# Wi-Fi & MQTT
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
