[package]
name = "backend"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Workspace
shared = { path = "../shared", features = ["utoipa"] }

# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Database
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }

# MQTT protocol
rumqttc = "0.25.1"

# API
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }