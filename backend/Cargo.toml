[package]
name = "backend"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Workspace
shared = { path = "../shared" }

# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

# Database
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }

# MQTT protocol
rumqttc = "0.25.1"